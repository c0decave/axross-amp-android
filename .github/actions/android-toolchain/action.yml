# What a build of the APK needs, the same for ci.yml and release.yml: Rust
# with the Android targets, cargo-ndk, a JDK and Gradle for the Android
# Gradle Plugin, and the NDK in the version android/gradle.properties names
# (amp.ndkVersion) with ANDROID_NDK_HOME pointing at it.
name: Android toolchain
description: Rust for Android, cargo-ndk, JDK 17, Gradle and the pinned NDK

inputs:
  cargo-ndk-version:
    description: The cargo-ndk release to install (from crates.io, with its own lock)
    default: "4.1.2"
  gradle-version:
    description: The Gradle release that runs the build
    default: "8.14.6"

runs:
  using: composite
  steps:
    - name: Rust (rustup, stable, clippy) with the Android targets
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal --component clippy
        rustup default stable
        rustup target add aarch64-linux-android x86_64-linux-android
    - name: cargo-ndk
      shell: bash
      run: cargo install cargo-ndk --version "${{ inputs.cargo-ndk-version }}" --locked
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "17"
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        gradle-version: ${{ inputs.gradle-version }}
        cache-disabled: true
    - name: The NDK (the version android/gradle.properties names)
      shell: bash
      run: |
        NDK_VERSION=$(sed -n 's/^amp\.ndkVersion=//p' android/gradle.properties)
        test -n "$NDK_VERSION" || { echo "::error::no amp.ndkVersion in android/gradle.properties"; exit 1; }
        NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
        if [ ! -d "$NDK" ]; then
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null
        fi
        test -f "$NDK/build/cmake/android.toolchain.cmake"
        echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
        echo "the NDK: $NDK"
