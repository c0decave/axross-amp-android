# What a build of the APK needs, the same for ci.yml and release.yml: Rust
# with the Android targets, cargo-ndk, a JDK and Gradle for the Android
# Gradle Plugin, and the NDK in the version android/gradle.properties names
# (amp.ndkVersion) with ANDROID_NDK_HOME pointing at it.
#
# The work and the versions live in scripts/ci/ (android-toolchain.sh,
# versions.env); this file only pins the JDK's and Gradle's setup actions.
name: Android toolchain
description: Rust for Android, cargo-ndk, the JDK, Gradle and the pinned NDK

runs:
  using: composite
  steps:
    - name: The versions (scripts/ci/versions.env, android/gradle.properties)
      id: versions
      shell: bash
      run: bash scripts/ci/android-toolchain.sh versions
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ steps.versions.outputs.java }}
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        gradle-version: ${{ steps.versions.outputs.gradle }}
        cache-disabled: true
    - name: Rust with the Android targets, cargo-ndk, the NDK
      shell: bash
      run: bash scripts/ci/android-toolchain.sh install
