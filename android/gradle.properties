org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# The NDK that builds the native library: the CI installs this version and
# points ANDROID_NDK_HOME at it; Gradle strips the library with it.
amp.ndkVersion=28.2.13676358
# The versionCode of Cargo.toml's version (major * 10000 + minor * 100 +
# patch), written out for tools that read it from a file - F-Droid's
# checkupdates (docs/fdroid/). The build fails if it is not Cargo.toml's.
amp.versionCode=101
