# The Gradle this project is built with (scripts/ci/versions.env, GRADLE_VERSION):
# for tools that read it (F-Droid's build server, `gradle wrapper`). The
# wrapper's jar and scripts are not in the repository; CI installs Gradle itself.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.6-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
